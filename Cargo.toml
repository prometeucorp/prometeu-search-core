[package]
name = "prometeu-search"
version = "0.1.0"
edition = "2024"
description = "Local code search for agents, standalone or bundled with Prometeu"
license = "MIT"
repository = "https://github.com/prometeucorp/prometeu-search-core"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
ignore = "0.4"
notify = "8"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
